title: "日本インスティテューショナル・リサーチ協会"
description: "日本IR協会(JAIR)の公式サイトです"
# 試験公開(プロジェクトサイト)。本番は url: https://jairweb.jp / baseurl: "" に変更する。
url: "https://masaomori.github.io"
baseurl: "/jair"
lang: ja
timezone: Asia/Tokyo
theme: minima
permalink: /:year/:month/:day/:title/
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
header_pages:
  - pages/about.md
  - pages/organization.md
  - pages/achievements.md
  - pages/meetings.md
  - pages/membership.md
  - pages/inquiry.md
# 試験公開中は検索エンジンに載せない(本番切替時に削除)
robots_noindex: true
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
